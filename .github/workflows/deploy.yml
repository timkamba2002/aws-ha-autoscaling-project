name: CI/CD Pipeline - 3-Tier Web App

on:
  push:
    branches: 
      - development

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ./app
      - run: npm run build
        working-directory: ./app
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build

  deploy-frontend:
    name: Upload React Build to S3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 sync build/ s3://ha-project-frontend-builds/frontend/current/ --delete
          echo "✅ React build uploaded to S3 at $(date)"
