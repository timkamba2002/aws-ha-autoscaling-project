name: CI/CD Pipeline - HA To-Do App (Demo Ready)

# =============================================================================
# PRESENTATION-FRIENDLY PIPELINE
# =============================================================================
# This workflow is designed for a clean demo:
#
# 1. Push to `development` branch
#    → Automatically builds + deploys to **Development** environment
#
# 2. Manually trigger workflow → choose "staging"
#    → Deploys to **Staging** environment
#
# 3. Manually trigger workflow → choose "production"
#    → Hits **Manual Approval Gate** (GitHub Environment)
#    → Then deploys to **Production**
#
# This gives you a professional promotion story:
# Development (auto) → Staging (manual) → Production (with approval gate)
#
# IMPORTANT FOR DEMO:
# - Make sure your repo has a GitHub Environment called "production"
#   with at least one Required Reviewer (you can add yourself).
# - Go to Settings → Environments → production → Add required reviewers.
# =============================================================================

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (for manual promotion)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ha-project-terraform-state-866934333672
  FRONTEND_BUCKET: ha-project-frontend-builds
  OIDC_ROLE: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2

jobs:
  # ===================== BUILD =====================
  build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build React
        working-directory: ./app
        env:
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE || secrets.REACT_APP_API_BASE || '' }}
        run: |
          npm ci
          npm run build

      - name: Upload React Build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build
          retention-days: 7

  # ===================== DEPLOY TO DEVELOPMENT (Automatic) =====================
  deploy-dev:
    name: Deploy to Development
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply (Development)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/development/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=development" \
            -auto-approve || true

      - name: Download & Deploy React to S3 (Dev)
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (current/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/current/ --delete

      - name: Trigger ASG Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ha-project-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=0,InstanceWarmup=60 \
            --region ${{ env.AWS_REGION }} || true

      - name: Demo Note
        run: echo "✅ Deployed to Development. Open your ALB to see the site."

  # ===================== DEPLOY TO STAGING (Manual) =====================
  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply (Staging)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=staging" \
            -auto-approve || true

      - name: Download & Deploy React to S3 (Staging)
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (staging/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/staging/ --delete || true

      - name: Demo Note
        run: |
          echo "✅ Deployed to Staging."
          echo "This completes the Development → Staging promotion step."

  # ===================== PRODUCTION WITH MANUAL APPROVAL =====================
  production-approval:
    name: Manual Approval Required
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production          # ← This creates the manual approval gate
      url: https://github.com   # Update this to your real prod URL later
    steps:
      - run: echo "✅ Manual approval granted. Proceeding to Production deployment."

  deploy-production:
    name: Deploy to Production
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply (Production)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=production" \
            -auto-approve || true

      - name: Download & Deploy React to S3 (Production)
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (production/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/production/ --delete || true

      - name: Demo Note
        run: |
          echo "✅ Deployed to Production after manual approval gate."
          echo "This completes the full promotion flow: Dev → Staging → Production (with approval)."