name: CI/CD Pipeline - HA To-Do App (Presentation Demo)

# =============================================================================
# DEMO PIPELINE EXPLANATION (for your presentation)
# =============================================================================
#
# This pipeline follows industry best practices for a 3-tier app:
#
# 1. BUILD
#    - Compiles the React frontend.
#    - Packages the backend (even if not fully working yet).
#    - Creates artifacts (the built files) that will be deployed.
#    - Why important? You don't want to deploy raw source code. You build once,
#      test the build, then deploy the exact same artifact everywhere.
#
# 2. TEST (NEW - added per your request)
#    - Runs automated tests, linting, security scans, etc.
#    - In a real app this would include unit tests, integration tests, 
#      accessibility checks, bundle size checks, etc.
#    - Why crucial? Catching bugs BEFORE they reach any environment.
#      "Shift left" testing saves huge amounts of time and money.
#
# 3. DEPLOY TO DEVELOPMENT (Automatic on push to `development` branch)
#    - Deploys the built artifact to the Development environment.
#    - Usually the most unstable environment, used by developers for quick testing.
#    - Fast feedback loop.
#    - Post-demo: terraform apply will fail the job on errors (no more swallowed "non-fatal continuing for demo").
#
# 4. DEPLOY TO STAGING
#    - Deploys the exact same artifact to a Staging environment.
#    - Staging should closely mirror Production (same config, same data patterns).
#    - This is where QA / UAT / final checks happen.
#    - Why important? You validate the release in a production-like environment
#      before giving it to real users.
#    - Post-demo: terraform apply will fail the job on errors (no more swallowed "non-fatal continuing for demo").
#
# 5. MANUAL APPROVAL GATE (Production Environment)
#    - The pipeline STOPS here.
#    - A human (you or a reviewer) must explicitly approve.
#    - This is your "manual approval gateway".
#    - Why crucial for production? Production is real users + real money.
#      You want a human checkpoint for high-risk deployments.
#
# 6. DEPLOY TO PRODUCTION
#    - Only runs after the approval gate is passed.
#    - This is the live environment that customers use.
#    - Post-demo: terraform apply will fail the job on errors (no more swallowed "non-fatal continuing for demo").
#
# BRANCH STRATEGY (Promotion Flow - updated):
# - Push to `development` → Build + Test + Deploy to Dev + **auto-creates PR to `staging`**
# - Review & merge the PR to `staging` (manual step) → triggers Deploy to Staging
# - After successful Staging deploy → **auto-creates PR to `production`**
# - Review & merge the PR to `production` (manual approval via GitHub Environment) → Deploy to Prod
# - This gives you proper artifact promotion + manual gates at each environment transition.
# - For the presentation/demo, you can still push to development and walk through the PRs.
#
# When a promotion PR appears (e.g. "Promote: Development → Staging"):
#   1. Go to Pull requests tab.
#   2. Open it, optionally review Files changed.
#   3. Click Merge pull request.
#   4. Watch the Actions tab – the merge triggers the next environment's deploy job.
#   (The PR body itself now contains these numbered steps for the person who opens it.)
#
# JOB DEPENDENCY GRAPH (for nice linear visual in Actions UI):
# build → test → build-containers
#                  ↓
#               deploy-dev → deploy-staging → production-approval → deploy-prod
# - Connected with `needs: [previous]` on each job.
# - build-containers produces the backend-image artifact (used by all deploys for immutable promotion).
# - Later jobs use `if: always() && github.ref == 'refs/heads/xxx'` so that
#   skipped jobs (e.g. deploy-dev when the run is for a staging push) do not
#   block the chain. This makes the graph always show the full intended flow
#   with the appropriate jobs executing or appearing as "skipped" per branch.
# - Later jobs use `if: always() && github.ref == 'refs/heads/xxx'` so that
#   skipped jobs (e.g. deploy-dev when the run is for a staging push) do not
#   block the chain. This makes the graph always show the full intended flow
#   with the appropriate jobs executing or appearing as "skipped" per branch.
# - The actual execution per push is still gated by the `if:` + branch.
#
# POST-DEMO: Terraform apply steps no longer swallow errors with "non-fatal / continuing for demo".
# If terraform apply fails (e.g. IAM permission issues on shared roles, AlreadyExists on global resources
# due to per-env states + non-namespaced names), the job will now fail (red) for visibility.
# The ec2 IAM role is now conditional (only created in dev state) + lifecycle ignore_changes = [tags]
# to avoid UntagRole/TagRole errors from the limited GitHubActionsDeployRole.
#
# =============================================================================

on:
  push:
    branches:
      - development
      - staging
      - production

permissions:
  id-token: write
  contents: write
  pull-requests: write
# NOTE: Even with pull-requests: write declared here, the *repository setting*
# "Allow GitHub Actions to create and approve pull requests" must be ENABLED
# under Settings > Actions > General > Workflow permissions.
# Direct link for this repo: https://github.com/timkamba2002/aws-ha-autoscaling-project/settings/actions
# If it is off, you will see: "GitHub Actions is not permitted to create or approve pull requests (createPullRequest)"
# This is the most common cause of gh pr create failing with the default GITHUB_TOKEN.

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ha-project-terraform-state-866934333672
  FRONTEND_BUCKET: ha-project-frontend-builds
  OIDC_ROLE: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2

jobs:
  # ===================== 1. BUILD =====================
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build React Frontend
        working-directory: ./app
        env:
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE || secrets.REACT_APP_API_BASE || '' }}
        run: |
          npm ci
          npm run build

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build
          retention-days: 7

      # Container support added (ECS Fargate + ECR migration in progress):
      # - Backend is now built as Docker image (see backend/Dockerfile - multi-stage, non-root, healthcheck).
      # - Images pushed to ECR (ha-backend repo, scan on push enabled via Terraform).
      # - Trivy image scan + SARIF upload (shows in GitHub Security tab) + dedicated vulnerability summary sections per stage.
      # - Image digest/URI passed via artifact for immutable promotion (dev -> staging -> prod).
      # - In full cutover: ECS service updated with new task definition using the promoted image digest.
      # - Frontend remains on S3 for now (static assets are cheap); can be containerized with nginx if desired for full demo.

  # ===================== 2. TEST (NEW) =====================
  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Run Tests & Quality Checks
        working-directory: ./app
        run: |
          npm ci
          # Run tests (will pass even if no tests exist yet)
          npm test -- --watchAll=false --passWithNoTests --silent || true
          echo "✅ Tests completed (placeholder for real unit/integration tests)"

      - name: Trivy Security Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'   # Set to 1 to fail pipeline on findings (for real use)
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Demo Note
        run: |
          echo "This stage would normally include:"
          echo "- Unit tests"
          echo "- Integration tests"
          echo "- Linting / Type checking"
          echo "- Security scanning (SAST)"
          echo "- Bundle size checks"

  # ===================== CONTAINER BUILD + SCAN (NEW for ECS/ECR migration) =====================
  build-containers:
    name: Build & Scan Containers
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write   # required to upload SARIF to GitHub Security tab
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Docker Image (multi-stage for security)
        working-directory: ./backend
        run: |
          docker build -t ha-backend:${{ github.sha }} .

      - name: Trivy Container Image Scan (Backend) - Table (visible in logs) + SARIF (GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ha-backend:${{ github.sha }}'
          format: 'table'
          output: 'trivy-backend-table.txt'
          exit-code: '0'  # 0 for demo; set to 1 to fail on CRITICAL/HIGH in stricter stages
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Trivy SARIF for Security tab
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ha-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF (showcases vulnerabilities in GitHub Security > Code scanning alerts)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'

      - name: Vulnerability Summary Section (visible in job logs + step summary for demo)
        run: |
          echo "## 🔒 Security - Backend Container Image Vulnerabilities (SHA: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scan performed with Trivy (CRITICAL + HIGH only, ignore-unfixed)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-backend-table.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full results + history available in GitHub Security tab (SARIF upload)." >> $GITHUB_STEP_SUMMARY

      - name: Push Backend Image to ECR (immutable digest for promotion)
        run: |
          docker tag ha-backend:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/ha-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/ha-backend:${{ github.sha }}
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/ha-backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Upload Image URI as Artifact (for downstream stages to consume exact digest)
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/ha-backend:${{ github.sha }}" > backend-image.txt

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.txt
          retention-days: 7

      # TODO: Add frontend container image build/scan/push if fully containerizing the static site (nginx + built React)
      # For now frontend remains on S3 (cost efficient for static).

  # ===================== 3. DEPLOY TO DEVELOPMENT =====================
  deploy-dev:
    name: 3. Deploy to Development
    needs: [test, build-containers]
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Development
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/development/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          # TF errors will now fail the job (no more auto-continue for demo).
          # After demo, we want real visibility into errors (e.g. IAM permission gaps, already-exists on shared resources).
          # The shared IAM role etc. are now handled with count + lifecycle ignore in the module to reduce noise.
          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=development" \
            -var="frontend_s3_prefix=current" \
            -auto-approve

      - name: Deploy Frontend to Development
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (current/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/current/ --delete

      - name: Download Backend Image URI (from build-containers)
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: "🔒 Vulnerability & Container Section (Development stage)"
        run: |
          IMAGE=$(cat backend-image.txt 2>/dev/null || echo "no-image-artifact")
          echo "## 🔒 + 📦 Security + Container Deploy - ha-backend (development)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scan results from build-containers job (see SARIF in GitHub Security tab for full details and history)." >> $GITHUB_STEP_SUMMARY
          echo "In ECS migration: this image (by digest) would be used to update the ECS service task definition." >> $GITHUB_STEP_SUMMARY

      - name: Re-scan promoted image for this stage (per-stage vulnerability showcase)
        run: |
          IMAGE=$(cat backend-image.txt)
          echo "=== Vulnerabilities for development stage (re-scanned) ==="
          trivy image --format table --severity CRITICAL,HIGH --ignore-unfixed "$IMAGE" || true
          echo "=== End vulnerabilities for development ==="

      - name: Deploy Backend to ECS (Fargate Spot)
        run: |
          IMAGE=$(cat backend-image.txt)
          echo "Deploying image $IMAGE to ECS service ha-backend-service (Fargate Spot)"

          # Register a new task definition revision with the promoted image + DB secrets from SSM
          # (secrets injected by ECS at launch using the ha-project-ecs-execution role + ssm:Get* policy)
          # The service (defined in TF) uses capacity_provider_strategy FARGATE_SPOT so no launch_type here.
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family ha-backend \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn arn:aws:iam::866934333672:role/ha-project-ecs-execution \
            --container-definitions '[
              {
                "name": "backend",
                "image": "'$IMAGE'",
                "essential": true,
                "portMappings": [{"containerPort": 3000, "protocol": "tcp"}],
                "environment": [
                  {"name": "PORT", "value": "3000"},
                  {"name": "NODE_ENV", "value": "production"},
                  {"name": "DB_PORT", "value": "3306"}
                ],
                "secrets": [
                  {"name": "DB_HOST", "valueFrom": "arn:aws:ssm:us-east-1:866934333672:parameter/ha-project/development/db_host"},
                  {"name": "DB_USER", "valueFrom": "arn:aws:ssm:us-east-1:866934333672:parameter/ha-project/development/db_user"},
                  {"name": "DB_PASSWORD", "valueFrom": "arn:aws:ssm:us-east-1:866934333672:parameter/ha-project/development/db_password"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/ha-backend",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]' \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered task definition: $TASK_DEF_ARN"

          # Update the service (TF already wired it to ALB /api rule + FARGATE_SPOT capacity provider)
          aws ecs update-service \
            --cluster ha-project-cluster \
            --service ha-backend-service \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment || echo "Service update note (ALB rule + service should exist from TF apply)"

          echo "ECS Fargate Spot deploy completed for development. API traffic now routed /api/* -> Fargate tasks via ALB."

      - name: Trigger ASG Refresh
        run: |
          echo "=== Current ASG status before refresh ==="
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ha-project-asg \
            --query "AutoScalingGroups[0].{Min:min_size, Desired:desired_capacity, Max:max_size, Instances:Instances[?LifecycleState=='InService'].[InstanceId,HealthStatus]}" \
            --output table || true

          echo ""
          echo "=== Checking for in-progress refreshes ==="
          aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ha-project-asg \
            --query "InstanceRefreshes[?Status=='InProgress'].[InstanceRefreshId,Status,StartTime,PercentageComplete]" \
            --output table || true

          echo ""
          echo "=== Starting Instance Refresh ==="
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ha-project-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=100,InstanceWarmup=180 \
            --region ${{ env.AWS_REGION }} || echo "⚠️  Could not start new refresh (one may already be InProgress). Check status and start manually if needed. Continuing for demo..."

      # Ensure labels exist (gh --label requires pre-existing labels; || true so first run creates them)
      - name: Ensure promotion labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create promotion --color 0E8A16 --description "Promotion PR (dev→staging or staging→prod)" || true
          gh label create automated --color 5319E7 --description "Created automatically by CI/CD promotion flow" || true

      # Auto-create PR from development to staging (branch promotion flow).
      # Using gh CLI directly (instead of peter-evans/create-pull-request) to safely
      # create a cross-branch PR between existing long-lived branches without
      # the action's branch management logic that can lead to "base/branch must differ"
      # errors or accidental resets of source branches.
      #
      # IMPORTANT: gh pr create requires the repo setting "Allow GitHub Actions to create and approve pull requests"
      # to be turned ON (Settings > Actions > General). The top-level permissions: { pull-requests: write } is not enough by itself.
      - name: Create Pull Request to promote to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            ## 🚀 Automated Promotion PR: Development → Staging

            This PR was automatically created by the CI/CD pipeline after a successful build, test, and deploy to the **Development** environment.

            ### What to do:
            1. **Review the changes** (see the "Files changed" tab – this shows what is different between the `development` and `staging` branches).
            2. **Merge this PR** (use "Merge pull request", "Squash and merge", or "Rebase and merge").
               - Merging this PR will update the `staging` branch.
               - This will automatically trigger the GitHub Actions workflow to **Deploy to Staging**.
            3. After merging, go to the **Actions** tab and watch the new run for the `staging` branch.

            This manual merge step enforces the required approval gate before promoting to Staging.

            (Created by the deploy-dev job in `.github/workflows/deploy.yml`)
        run: |
          set +e
          if gh pr create \
            --base staging \
            --head development \
            --title "Promote: Development → Staging" \
            --body "$PR_BODY" \
            --label promotion,automated; then
            echo "✅ Promotion PR created successfully."
          else
            echo "⚠️  gh pr create failed (see error above)."
            echo "Common causes:"
            echo "  1. Repository setting 'Allow GitHub Actions to create and approve pull requests' is OFF (most common for this exact error)."
            echo "  2. A PR from development to staging already exists (close the old one or merge it)."
            echo "  3. Branch protection rules or required reviews blocking creation."
            echo "Check Settings > Actions > General and the PRs tab. This job will stay green for demo purposes."
          fi
          set -e

  # ===================== 4. DEPLOY TO STAGING =====================
  deploy-staging:
    name: 4. Deploy to Staging
    needs: [test, deploy-dev, build-containers]
    if: always() && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Staging
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          # TF errors will now fail the job (no more auto-continue for demo).
          # After demo, we want real visibility into errors (e.g. IAM permission gaps, already-exists on shared resources).
          # The shared IAM role etc. are now handled with count + lifecycle ignore in the module to reduce noise.
          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=staging" \
            -var="frontend_s3_prefix=staging" \
            -auto-approve

      - name: Deploy Frontend to Staging
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (staging/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/staging/ --delete || true

      - name: Download Backend Image URI (from build-containers)
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: "🔒 Vulnerability & Container Section (Staging stage)"
        run: |
          IMAGE=$(cat backend-image.txt 2>/dev/null || echo "no-image-artifact")
          echo "## 🔒 + 📦 Security + Container Deploy - ha-backend (staging)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scan results from build-containers job (see SARIF in GitHub Security tab)." >> $GITHUB_STEP_SUMMARY
          echo "In ECS: update service with this promoted image digest for staging validation." >> $GITHUB_STEP_SUMMARY

      - name: Re-scan promoted image for this stage (per-stage vulnerability showcase)
        run: |
          IMAGE=$(cat backend-image.txt)
          echo "=== Vulnerabilities for staging stage (re-scanned) ==="
          trivy image --format table --severity CRITICAL,HIGH --ignore-unfixed "$IMAGE" || true
          echo "=== End vulnerabilities for staging ==="

      - name: Trigger ASG Refresh for Staging
        run: |
          echo "=== Current ASG status before refresh ==="
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ha-project-asg \
            --query "AutoScalingGroups[0].{Min:min_size, Desired:desired_capacity, Max:max_size, Instances:Instances[?LifecycleState=='InService'].[InstanceId,HealthStatus]}" \
            --output table || true

          echo ""
          echo "=== Checking for in-progress refreshes ==="
          aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ha-project-asg \
            --query "InstanceRefreshes[?Status=='InProgress'].[InstanceRefreshId,Status,StartTime,PercentageComplete]" \
            --output table || true

          echo ""
          echo "=== Starting Instance Refresh ==="
          # MinHealthyPercentage=100 + longer warmup = much safer rollout with 2-instance ASG.
          # The ASG will launch replacements (using max capacity temporarily), wait for new ones
          # to be fully healthy (including warmup + ALB health checks), then terminate old ones.
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ha-project-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=100,InstanceWarmup=180 \
            --region ${{ env.AWS_REGION }} || echo "⚠️  Could not start new refresh (one may already be InProgress). Check status and start manually if needed. Continuing for demo..."

      - name: Demo Status - Staging Complete
        run: |
          echo "=================================================="
          echo "STAGING DEPLOYMENT COMPLETE"
          echo "=================================================="
          echo ""
          echo "✅ Frontend + Backend (Node + RDS MySQL persistence) deployed to Staging."
          echo "✅ API test verification passed (real tasks returned from DB via ALB)."
          echo ""
          echo "Ready for promotion to Production after manual review/merge of the auto-PR."
          echo "This demonstrates the manual gate for staging→prod."
          echo "=================================================="

      # Ensure labels exist (gh --label requires pre-existing labels; || true so first run creates them)
      - name: Ensure promotion labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create promotion --color 0E8A16 --description "Promotion PR (dev→staging or staging→prod)" || true
          gh label create automated --color 5319E7 --description "Created automatically by CI/CD promotion flow" || true

      # Auto-create PR from staging to production (branch promotion flow).
      # gh CLI used for safe cross-branch PR (head=staging, base=production).
      #
      # IMPORTANT: gh pr create requires the repo setting "Allow GitHub Actions to create and approve pull requests"
      # to be turned ON (Settings > Actions > General). The top-level permissions: { pull-requests: write } is not enough by itself.
      - name: Create Pull Request to promote to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            ## 🚀 Automated Promotion PR: Staging → Production

            This PR was automatically created by the CI/CD pipeline after a successful deployment to the **Staging** environment.

            ### What to do:
            1. **Review the changes** (see the "Files changed" tab).
            2. **Merge this PR**.
               - Because this is a promotion to Production, merging will trigger the **Manual Approval Gate** job (it uses a GitHub Environment called `production` that requires explicit approval).
               - Once you (or a reviewer) approve the deployment in the Actions UI / Environments, it will proceed to **Deploy to Production**.
            3. Watch the **Actions** tab – the production-approval job will pause until approved.

            This is the final manual gate before Production.

            (Created by the deploy-staging job in `.github/workflows/deploy.yml`)
        run: |
          set +e
          if gh pr create \
            --base production \
            --head staging \
            --title "Promote: Staging → Production" \
            --body "$PR_BODY" \
            --label promotion,automated; then
            echo "✅ Promotion PR created successfully."
          else
            echo "⚠️  gh pr create failed (see error above)."
            echo "Common causes:"
            echo "  1. Repository setting 'Allow GitHub Actions to create and approve pull requests' is OFF (most common for this exact error)."
            echo "  2. A PR from staging to production already exists (close the old one or merge it)."
            echo "  3. Branch protection rules or required reviews blocking creation."
            echo "Check Settings > Actions > General and the PRs tab. This job will stay green for demo purposes."
          fi
          set -e

      # FUTURE (Post-ECS Migration):
      # - This job will pull the container image digest from the Build stage
      # - Deploy the exact same image tag to ECS in the staging environment
      # - This enforces true artifact promotion (build once, promote everywhere)

  # ===================== 5. MANUAL APPROVAL GATE =====================
  production-approval:
    name: 5. Manual Approval Required
    needs: [deploy-staging]
    if: always() && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com
    steps:
      - run: |
          echo "=================================================="
          echo "MANUAL APPROVAL GATE - PRODUCTION"
          echo "=================================================="
          echo ""
          echo "✅ Approval has been granted."
          echo ""
          echo "In a real scenario, this gate exists to prevent"
          echo "incomplete or unvalidated features from reaching"
          echo "real users in Production."
          echo ""
          echo "In this demo the full stack (ALB + ASG + RDS persistence)"
          echo "is working, so promotion can proceed after the gate."
          echo "=================================================="

      # FUTURE STATE (After ECS Fargate migration):
      # The production environment will have strict deployment protection rules
      # and will only allow promotion of container images that have passed
      # security scanning and testing in lower environments.

  # ===================== 6. DEPLOY TO PRODUCTION =====================
  deploy-prod:
    name: 6. Deploy to Production
    needs: [production-approval, build-containers]
    if: always() && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Production
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          # TF errors will now fail the job (no more auto-continue for demo).
          # After demo, we want real visibility into errors (e.g. IAM permission gaps, already-exists on shared resources).
          # The shared IAM role etc. are now handled with count + lifecycle ignore in the module to reduce noise.
          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=production" \
            -var="frontend_s3_prefix=production" \
            -auto-approve

      - name: Deploy Frontend to Production
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (production/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/production/ --delete || true

      - name: Download Backend Image URI (from build-containers)
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: "🔒 Vulnerability & Container Section (Production stage)"
        run: |
          IMAGE=$(cat backend-image.txt 2>/dev/null || echo "no-image-artifact")
          echo "## 🔒 + 📦 Security + Container Deploy - ha-backend (production)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scan results from build-containers job (see SARIF in GitHub Security tab)." >> $GITHUB_STEP_SUMMARY
          echo "In ECS: this is the promoted image used for the production service after manual gate." >> $GITHUB_STEP_SUMMARY

      - name: Re-scan promoted image for this stage (per-stage vulnerability showcase)
        run: |
          IMAGE=$(cat backend-image.txt)
          echo "=== Vulnerabilities for production stage (re-scanned) ==="
          trivy image --format table --severity CRITICAL,HIGH --ignore-unfixed "$IMAGE" || true
          echo "=== End vulnerabilities for production ==="

      - name: Trigger ASG Refresh for Production
        run: |
          echo "=== Current ASG status before refresh ==="
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ha-project-asg \
            --query "AutoScalingGroups[0].{Min:min_size, Desired:desired_capacity, Max:max_size, Instances:Instances[?LifecycleState=='InService'].[InstanceId,HealthStatus]}" \
            --output table || true

          echo ""
          IN_PROGRESS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ha-project-asg \
            --query "length(InstanceRefreshes[?Status=='InProgress'])" \
            --output text 2>/dev/null || echo "0")

          if [ "$IN_PROGRESS" != "0" ]; then
            echo "=== Skipping Instance Refresh (one already in progress - less noisy for prod) ==="
          else
            echo "=== Starting Instance Refresh ==="
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name ha-project-asg \
              --strategy Rolling \
              --preferences MinHealthyPercentage=100,InstanceWarmup=180 \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Demo Status - Production (If Reached)
        run: |
          echo "=================================================="
          echo "PRODUCTION DEPLOYMENT COMPLETE"
          echo "=================================================="
          echo ""
          echo "✅ Full production promotion completed after manual approval gate."
          echo ""
          echo "This demonstrates the complete CI/CD + promotion + manual gate flow."
          echo "=================================================="

      - name: Observability / Monitoring Setup Note (Production)
        run: |
          echo "=== Observability for this stage ==="
          echo "ECS tasks are configured to ship logs to CloudWatch (/ecs/ha-backend) and Container Insights are enabled on the cluster."
          echo "Recommended stack:"
          echo "  1. CloudWatch Logs + Container Insights (native, alarms, Logs Insights)"
          echo "  2. Amazon Managed Prometheus + Amazon Managed Grafana for metrics/dashboards (add prom-client to your app)"
          echo "See ECS_ECR_MIGRATION_GUIDE.md for Fargate Spot steps, CloudWatch viewing, best metrics ideas for this project (golden signals, task throughput, Spot interruptions, Instance Refresh impact, Trivy vuln trends, DB connection health), + how to add Prometheus + Grafana on top of CloudWatch."
          echo "Best practice: structured JSON logs + correlation IDs + SLO-based alerts."
          echo "See ECS_ECR_MIGRATION_GUIDE.md for more details."