name: CI/CD Pipeline - 3-Tier Web App

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  # 1. BUILD PACKAGE
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Archive application
        run: tar -czf app.tar.gz app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app.tar.gz

  # 2. TEST VALIDATE
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run tests
        working-directory: ./app
        run: npm test

  # 3. DEPLOY TO STAGING
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Deploy to Staging
        run: ./scripts/deploy-staging.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # 4. MANUAL APPROVAL GATE
  approval:
    name: Manual Approval Gate
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - name: Wait for Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: timothy.kamba@techconsulting.tech
          minimum-approvals: 1
          issue-title: "Deploy to Production - Manual Approval Required"
          issue-body: |
            Please review the staging deployment before approving production.

  # 5. DEPLOY TO PRODUCTION
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approval
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Deploy to Production
        run: ./scripts/deploy-production.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
