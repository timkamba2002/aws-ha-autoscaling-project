name: CI/CD Pipeline - 3-Tier Web App

on:
  push:
    branches: 
      - development     # You will push your changes here

permissions:
  id-token: write
  contents: read

jobs:
  build-test-plan:
    name: Build, Test & Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build React App
        working-directory: ./app
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app/build

  # Auto Deploy to Development
  deploy-development:
    needs: build-test-plan
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1

      - name: Terraform Apply - Development
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

  # Deploy to Production (with Manual Approval)
  deploy-production:
    needs: build-test-plan
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1

      - name: Terraform Apply - Production
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
