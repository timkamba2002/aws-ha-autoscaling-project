name: CI/CD - HA To-Do App Demo Pipeline

# =============================================================================
# CLEAN DEMO PIPELINE FOR PRESENTATION
# =============================================================================
#
# HOW IT WORKS:
#
# 1. You push code to the `development` branch
#    → The pipeline automatically runs:
#       Build → Deploy to Development → Deploy to Staging
#    → Then it STOPS at the Manual Approval Gate for Production
#
# 2. In the GitHub UI you will see a prompt:
#    "Review deployments" for the production environment
#    → You click Approve (or Reject)
#
# 3. After you approve → it deploys to Production
#
# BRANCHES:
# - You ONLY need to push to the `development` branch.
# - You do NOT need to push to different branches for this demo.
# - Everything (Dev + Staging + waiting for Prod approval) happens from one push to `development`.
#
# This is the cleanest story for your instructor:
# "Code is pushed → automatically goes through Dev and Staging → requires manual approval before Production"
#
# SETUP BEFORE DEMO (do this once):
# - Go to your repo → Settings → Environments
# - Create an environment named exactly: "production"
# - Add at least one Required Reviewer (you can add yourself)
# =============================================================================

on:
  push:
    branches:
      - development

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ha-project-terraform-state-866934333672
  FRONTEND_BUCKET: ha-project-frontend-builds
  OIDC_ROLE: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2

jobs:
  # ===================== 1. BUILD =====================
  build:
    name: 1. Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build React
        working-directory: ./app
        env:
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE || secrets.REACT_APP_API_BASE || '' }}
        run: |
          npm ci
          npm run build

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build
          retention-days: 7

  # ===================== 2. DEPLOY TO DEVELOPMENT =====================
  deploy-dev:
    name: 2. Deploy to Development
    needs: build
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Development
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/development/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=development" \
            -auto-approve || true

      - name: Deploy React Frontend to Dev
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (current/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/current/ --delete

      - name: Trigger ASG Refresh (Dev)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ha-project-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=0,InstanceWarmup=60 \
            --region ${{ env.AWS_REGION }} || true

  # ===================== 3. DEPLOY TO STAGING =====================
  deploy-staging:
    name: 3. Deploy to Staging
    needs: deploy-dev
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Staging
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=staging" \
            -auto-approve || true

      - name: Deploy React Frontend to Staging
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (staging/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/staging/ --delete || true

      - name: Demo Note
        run: echo "✅ Staging deployment complete. Pipeline now waiting at Production approval gate."

  # ===================== 4. MANUAL APPROVAL GATE FOR PRODUCTION =====================
  production-approval:
    name: 4. Manual Approval Required for Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com
    steps:
      - run: echo "✅ Approval received. Proceeding to Production deployment."

  # ===================== 5. DEPLOY TO PRODUCTION =====================
  deploy-prod:
    name: 5. Deploy to Production
    needs: production-approval
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Apply - Production
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=production" \
            -auto-approve || true

      - name: Deploy React Frontend to Production
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload to S3 (production/)
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/production/ --delete || true

      - name: Demo Note
        run: |
          echo "✅ Production deployment complete after manual approval."
          echo "Full flow demonstrated: Dev (auto) → Staging (auto) → Production (manual approval gate)"