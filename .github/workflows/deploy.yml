name: CI/CD - HA 3-Tier To-Do App (React + Node + MySQL)

# =============================================================================
# HYBRID TRIGGER (AUTO ON PUSH + MANUAL BUTTONS)
# =============================================================================
# This file supports BOTH:
#
# 1. AUTOMATIC (what you are used to):
#    - Push to development branch → workflow runs by itself automatically.
#
# 2. MANUAL (for your presentation):
#    - After a successful run, you will see a "Run workflow" button
#      with dropdown (development / staging / production) in the Actions UI.
#
# The button appears in the Actions tab after you select this workflow name.
# =============================================================================

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (manual promotion)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ha-project-terraform-state-866934333672
  FRONTEND_BUCKET: ha-project-frontend-builds
  OIDC_ROLE: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2

jobs:
  build:
    name: 1. Build React + Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json

      - name: Build React Frontend
        working-directory: ./app
        env:
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE || secrets.REACT_APP_API_BASE || '' }}
        run: |
          npm ci
          npm run build

      - name: Package Backend
        working-directory: ./backend
        run: |
          npm ci --omit=dev
          rm -f ../backend.zip
          zip -r ../backend.zip .

      - name: Upload React Build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build
          retention-days: 7

      - name: Upload Backend Zip
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip
          retention-days: 7

  test-plan:
    name: 2. Test & Terraform Plan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=development" || true

  deploy-dev:
    name: Deploy to Development
    needs: [build, test-plan]
    if: github.ref == 'refs/heads/development' || github.event.inputs.environment == 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform Init (Development)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=ha-project/development/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply \
            -refresh=false \
            -lock=false \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="environment=development" \
            -auto-approve

      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend-dist

      - name: Upload React to S3
        run: |
          aws s3 sync ./frontend-dist s3://${{ env.FRONTEND_BUCKET }}/frontend/current/ --delete

      - name: Trigger ASG Instance Refresh (full stack deploy)
        run: |
          ASG_NAME="ha-project-asg"
          IN_PROGRESS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name $ASG_NAME \
            --query "InstanceRefreshes[?Status=='InProgress'].InstanceRefreshId" \
            --output text 2>/dev/null || true)
          if [ -n "$IN_PROGRESS" ] && [ "$IN_PROGRESS" != "None" ]; then
            echo "Cancelling previous refresh: $IN_PROGRESS"
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name $ASG_NAME --instance-refresh-id $IN_PROGRESS || true
            sleep 20
          fi

          echo "Starting Instance Refresh with safer warmup for full-stack (frontend + backend)"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --strategy Rolling \
            --preferences MinHealthyPercentage=0,InstanceWarmup=120 \
            --region ${{ env.AWS_REGION }} || true

      - name: Note
        run: echo "✅ Dev deploy finished. Wait 3-6 minutes then open ALB."
