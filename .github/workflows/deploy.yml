name: CI/CD Pipeline - 3-Tier Web App

on:
  push:
    branches: 
      - development

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ./app
      - run: npm run build
        working-directory: ./app
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build

  deploy-development:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
      - name: Terraform Apply (Targeted)
        run: |
          terraform apply -target=module.ec2.aws_launch_template.lt -auto-approve
        working-directory: ./terraform
      - name: Refresh Instances
        run: aws autoscaling start-instance-refresh --auto-scaling-group-name ha-project-asg --region us-east-1
