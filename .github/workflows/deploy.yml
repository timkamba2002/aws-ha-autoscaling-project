name: CI/CD Pipeline - 3-Tier Web App

on:
  push:
    branches: 
      - development

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build React App
        working-directory: ./app
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/build

  test-plan:
    name: Test & Terraform Plan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: ./terraform
      - run: terraform validate
        working-directory: ./terraform
      - run: terraform plan -out=tfplan
        working-directory: ./terraform

  # 1. Deploy to Development (Automatic)
  deploy-development:
    name: Deploy to Development
    needs: [test-plan]
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: react-build }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1
      - run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

  # 2. Deploy to Staging (Automatic - after Development succeeds)
  deploy-staging:
    name: Deploy to Staging
    needs: [deploy-development]
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: react-build }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1
      - run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

  # 3. Deploy to Production (Manual Approval)
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: react-build }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/GitHubActionsDeployRole-HAProjectV2
          aws-region: us-east-1
      - run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
